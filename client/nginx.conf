server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Config snapshots and .rsc exports can be a few MB.
    client_max_body_size 32m;

    # API proxy
    location /api/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        # Plan compilation and fleet queries can take a while on a large fleet.
        proxy_read_timeout 300s;
    }

    # Socket.io proxy (live device presence, job progress, alerts)
    location /socket.io/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Health check endpoint proxy — returns the running version.
    location /health {
        proxy_pass http://server:3001;
    }

    # Obligate SSO callback (server-side redirect + code exchange)
    location /auth/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # NOTE: CWMP/TR-069 (7547) is deliberately NOT proxied here. The ACS is a
    # separate Express listener published directly by the `server` service:
    # Digest authentication and long-lived CPE sessions do not survive a
    # reverse proxy cleanly. Do not add a /cwmp location.

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
